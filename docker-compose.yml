# Local full stack (and a ready-made base for Dokploy's "Docker Compose" deploys).
#   docker compose up --build
#   web  http://localhost:8080
#   api  http://localhost:3000/health
services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_BASE: /
        # The browser calls the API, so this must be reachable from the user's machine.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '8080:80'
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - '3000:3000'
    restart: unless-stopped
