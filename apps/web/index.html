<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E10" />
    <script>
      // Apply the saved light/dark mode before first paint (no flash). Mirrors
      // themeController.ts: dark unless the user picked light.
      (function () {
        var t = 'dark';
        try {
          if (localStorage.getItem('devbord:theme') === 'light') t = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta
      name="description"
      content="Devbord — tableros Kanban para equipos técnicos y no técnicos."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Devbord</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
